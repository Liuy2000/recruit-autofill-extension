<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>自动填写测试表单</title>
  <style>
    body { max-width: 760px; margin: 40px auto; font: 15px/1.5 "Microsoft YaHei",sans-serif; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    label { display: grid; gap: 6px; } input,select,textarea { padding: 9px; } textarea { min-height: 90px; }
    .wide { grid-column: 1/-1; }
    .el-form-item { display: grid; grid-template-columns: 100px 1fr; align-items: center; gap: 8px; }
    .el-form-item__label { display: block; }
    .el-form-item__content, .el-input, .el-select, .el-date-editor { min-width: 0; }
    .el-form-item input { width: 100%; }
    .el-radio { display: inline-flex; align-items: center; margin-right: 14px; cursor: pointer; }
    .el-radio input { position: absolute; opacity: 0; width: 0; height: 0; }
    .el-radio input:checked + span { color: #0f766e; font-weight: 700; }
    .el-select-dropdown { position: fixed; z-index: 10; left: 340px; top: 250px; width: 180px; padding: 6px; background: white; border: 1px solid #ccd6e0; box-shadow: 0 8px 20px #0002; }
    .el-select-dropdown__item { padding: 7px 9px; cursor: pointer; }
    .el-select-dropdown__item:hover { background: #eef8f6; }
    .phoenix-select { position: relative; min-height: 38px; padding: 8px 30px 8px 10px; border: 1px solid #ccd6e0; cursor: pointer; }
    .phoenix-select__content { margin: 0; padding: 0; list-style: none; }
    .phoenix-select__input { width: 100%; padding: 0; border: 0; outline: 0; color: transparent; cursor: pointer; }
    .phoenix-select-dropdown { position: fixed; z-index: 11; left: 540px; top: 330px; width: 180px; padding: 6px; background: white; border: 1px solid #ccd6e0; box-shadow: 0 8px 20px #0002; }
    .phoenix-single-select-list__item { padding: 7px 9px; cursor: pointer; }
    .field-search { min-height: 38px; padding: 8px 30px 8px 10px; border: 1px solid #ccd6e0; cursor: pointer; }
    .area-selector-container { position: fixed; z-index: 12; left: 500px; top: 220px; width: 240px; padding: 10px; background: white; border: 1px solid #ccd6e0; box-shadow: 0 8px 20px #0002; }
    .area-item-container { padding: 5px; }
    .area-text-label, .icon-container { cursor: pointer; }
    .phoenix-choice-panel { position: fixed; z-index: 13; left: 260px; top: 180px; width: 360px; padding: 12px; background: white; border: 1px solid #ccd6e0; box-shadow: 0 8px 20px #0002; }
    .phoenix-radio-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .phoenix-radio { cursor: pointer; }
  </style>
</head>
<body>
  <h1>招聘表单测试页</h1>
  <p>加载扩展并导入资料后，在本页点击“填写当前页面”。本页没有提交逻辑。</p>
  <form>
    <div class="el-form-item">
      <label class="el-form-item__label">*姓名</label>
      <div class="el-form-item__content"><div class="el-input"><input data-test="candidate-name" placeholder="请输入"></div></div>
    </div>
    <div class="el-form-item">
      <label class="el-form-item__label">*性别</label>
      <div class="el-form-item__content">
        <label class="el-radio"><input type="radio" name="enterpriseGender" value="男"><span>男</span></label>
        <label class="el-radio"><input type="radio" name="enterpriseGender" value="女"><span>女</span></label>
      </div>
    </div>
    <div class="el-form-item">
      <label class="el-form-item__label">*邮箱</label>
      <div class="el-form-item__content"><div class="el-input"><input data-test="email" type="email" placeholder="请输入"></div></div>
    </div>
    <label>手机号码<input type="tel" name="mobile"></label>
    <div class="el-form-item">
      <label class="el-form-item__label">*出生日期</label>
      <div class="el-form-item__content"><div class="el-date-editor"><input data-test="birth-date" readonly placeholder="请选择"></div></div>
    </div>
    <div class="el-form-item">
      <label class="el-form-item__label">*民族</label>
      <div class="el-form-item__content"><div class="phoenix-select" data-select="ethnicity"><div class="phoenix-select__placeHolder">请选择</div><input class="phoenix-select__input" data-test="ethnicity" readonly></div></div>
    </div>
    <div class="el-form-item">
      <label class="el-form-item__label">*政治面貌</label>
      <div class="el-form-item__content">
        <div class="el-select" data-select="political">
          <div class="el-select__wrapper" data-test="political" role="combobox" tabindex="0"><span class="el-select__placeholder">请选择</span></div>
        </div>
      </div>
    </div>
    <div class="form-item form-item--phoenix">
      <div class="form-item__title"><label class="form-item__text">*户口所在地</label></div>
      <div class="form-item__control">
        <div class="field field-search" data-select="household" data-test="household" tabindex="0">请选择</div>
      </div>
    </div>
    <div class="form-item form-item--phoenix">
      <div class="form-item__title"><label class="form-item__text">*最高学历</label></div>
      <div class="form-item__control">
        <div class="phoenix-select phoenix-select--editable" data-select="education">
          <div class="phoenix-select__placeHolder phoenix-select__placeHolder--show" data-test="education">请选择</div>
          <ul class="phoenix-select__content"><li class="phoenix-select__inputWrapper"><input class="phoenix-select__input phoenix-select__input--unText"></li></ul>
        </div>
      </div>
    </div>
    <label>毕业院校<input name="school"></label>
    <label>专业名称<input name="major"></label>
    <label>求职意向<input name="targetRole"></label>
    <label class="wide">自我介绍<textarea name="summary"></textarea></label>
    <label>身份证号码（敏感）<input name="idNumber"></label>
    <label>紧急联系人姓名（敏感）<input name="emergencyName"></label>
    <label>已存在内容（默认不覆盖）<input aria-label="姓名" value="保留此内容"></label>
    <label>简历附件（永不填写）<input type="file"></label>
  </form>
  <div class="phoenix-choice-panel" data-dropdown="ethnicity" hidden>
    <div class="phoenix-radio-group">
      <div class="phoenix-radio-group__radioItem"><div class="phoenix-radio">汉族</div></div>
      <div class="phoenix-radio-group__radioItem"><div class="phoenix-radio">回族</div></div>
      <div class="phoenix-radio-group__radioItem"><div class="phoenix-radio">蒙古族</div></div>
    </div>
    <button type="button">取消</button><button type="button" data-choice-confirm>确定</button>
  </div>
  <div class="el-select-dropdown" data-dropdown="political" hidden>
    <div class="el-select-dropdown__item" role="option">群众</div>
    <div class="el-select-dropdown__item" role="option">共青团员</div>
    <div class="el-select-dropdown__item" role="option">中共党员</div>
  </div>
  <div class="area-selector-container" data-dropdown="household" hidden>
    <div class="area-item-container" data-level="1"><span class="area-text-label">示例省</span></div>
    <div class="area-item-container" data-level="2" hidden><span class="area-text-label">示例市</span></div>
    <div class="area-item-container" data-level="3" hidden><span class="icon-container"><svg class="area-icon-RadioUnchecked" width="12" height="12"></svg></span><span class="area-text-label">示例区</span></div>
    <div class="area-footer-button"><div class="button-container"><button type="button">取消</button></div><div class="button-container"><button type="button" data-area-confirm>提交</button></div></div>
  </div>
  <div class="phoenix-container__dropdown phoenix-select-dropdown" data-dropdown="education" hidden>
    <ul class="phoenix-single-select-list__ul">
      <li class="phoenix-single-select-list__item">大学本科</li>
      <li class="phoenix-single-select-list__item">硕士研究生</li>
      <li class="phoenix-single-select-list__item">博士研究生</li>
    </ul>
  </div>
  <script>
    for (const name of ['political']) {
      const control = document.querySelector(`[data-select="${name}"]`);
      const dropdown = document.querySelector(`[data-dropdown="${name}"]`);
      control.addEventListener('click', () => { dropdown.hidden = false; });
      dropdown.addEventListener('click', event => {
        const option = event.target.closest('[role="option"]');
        if (!option) return;
        const input = control.querySelector('input');
        if (input) {
          input.value = option.textContent.trim();
          input.dispatchEvent(new Event('change', { bubbles: true }));
        } else {
          control.querySelector('.el-select__wrapper').textContent = option.textContent.trim();
        }
        dropdown.hidden = true;
      });
    }
    const ethnicityControl = document.querySelector('[data-select="ethnicity"]');
    const ethnicityDropdown = document.querySelector('[data-dropdown="ethnicity"]');
    let ethnicityPending = '';
    ethnicityControl.addEventListener('click', () => { ethnicityDropdown.hidden = false; });
    ethnicityDropdown.addEventListener('click', event => {
      const radio = event.target.closest('.phoenix-radio');
      if (radio) ethnicityPending = radio.textContent.trim();
      if (event.target.closest('[data-choice-confirm]')) {
        ethnicityControl.querySelector('input').value = ethnicityPending;
        ethnicityControl.querySelector('.phoenix-select__placeHolder').textContent = ethnicityPending;
        ethnicityDropdown.hidden = true;
      }
    });
    const householdControl = document.querySelector('[data-select="household"]');
    const householdDropdown = document.querySelector('[data-dropdown="household"]');
    householdControl.addEventListener('click', () => { householdDropdown.hidden = false; });
    let householdSelected = false;
    householdDropdown.addEventListener('click', event => {
      const item = event.target.closest('[data-level]');
      if (event.target.closest('[data-area-confirm]')) {
        if (householdSelected) householdControl.textContent = '示例省 / 示例市 / 示例区';
        householdDropdown.hidden = true;
        return;
      }
      if (!item) return;
      const level = Number(item.dataset.level);
      if (event.target.closest('.icon-container')) householdSelected = true;
      const next = householdDropdown.querySelector(`[data-level="${level + 1}"]`);
      if (next) setTimeout(() => { next.hidden = false; }, 650);
    });
    const educationControl = document.querySelector('[data-select="education"]');
    const educationDropdown = document.querySelector('[data-dropdown="education"]');
    educationControl.addEventListener('click', () => { educationDropdown.hidden = false; });
    educationDropdown.addEventListener('click', event => {
      const option = event.target.closest('.phoenix-single-select-list__item');
      if (!option) return;
      const value = option.textContent.trim();
      educationControl.querySelector('.phoenix-select__placeHolder').textContent = value;
      const input = educationControl.querySelector('input');
      input.value = value;
      input.dispatchEvent(new Event('change', { bubbles: true }));
      educationDropdown.hidden = true;
    });
  </script>
</body>
</html>
